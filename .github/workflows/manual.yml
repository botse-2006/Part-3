name: TestPROGPOE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create directories
        run: |
          mkdir -p lib
          mkdir -p bin

      - name: Download JUnit
        run: |
          curl -L -o lib/junit-4.13.2.jar https://search.maven.org/remotecontent?filepath=junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o lib/hamcrest-core-1.3.jar https://search.maven.org/remotecontent?filepath=org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile source files
        run: |
          javac -cp "lib/*" -d bin $(find PROGPOE/PROGPOE/src -name "*.java")

      - name: Compile test files
        run: |
          javac -cp "lib/*:bin" -d bin $(find PROGPOE/PROGPOE/test -name "*.java")

      - name: Run tests
        run: |
          java -cp "lib/*:bin" org.junit.runner.JUnitCore com.example.chatapp.ChatApp1Test
